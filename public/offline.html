<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F5F2" />
    <title>Sin conexión · Task Dashboard</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f5f2;
        color: #23221f;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
      }
      main {
        max-width: 360px;
        padding: 28px 24px;
        border-radius: 18px;
        background: #fff;
        border: 1px solid rgba(35, 34, 31, 0.08);
        box-shadow: 0 10px 30px rgba(35, 34, 31, 0.06);
        text-align: center;
      }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 20px; color: #6b6a65; line-height: 1.5; font-size: 14px; }
      a {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 12px;
        background: #5b5dd6;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>No he podido cargar el panel. Comprueba la conexión y vuelve a intentarlo.</p>
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
